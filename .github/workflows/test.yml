name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm tokens:build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage

  # Production build + shared-JS bundle budget gate (<180KB gzip).
  build:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build --webpack
      - run: pnpm budget

  # Mobile ES flows, accessibility, and visual snapshots. Specs self-skip at
  # runtime locally; CI requires seeded auth except for untrusted fork PRs.
  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Require seeded E2E credentials
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$TEST_USER_EMAIL" ] || [ -z "$TEST_USER_PASSWORD" ] || \
             [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Seeded E2E secrets are required for trusted CI runs."
            exit 1
          fi
      - run: pnpm test:e2e
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  # Lighthouse CI gate (perf >=90, a11y >=95, best-practices >=90, SEO >=90).
  # Reports persist as run artifacts (.lighthouseci) so scores can be
  # tracked commit over commit (#BKL-012 history).
  lighthouse:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    needs: build
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Require public Supabase configuration
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Supabase public configuration is required for Lighthouse builds."
            exit 1
          fi
      - run: pnpm build --webpack
      - run: pnpm exec lhci autorun
      - name: Summarize Lighthouse scores
        if: always()
        run: |
          node -e "
            const fs = require('node:fs');
            const path = require('node:path');
            const dir = '.lighthouseci';
            const files = fs.existsSync(dir) ? fs.readdirSync(dir).filter((f) => f.startsWith('lhr-') && f.endsWith('.json')) : [];
            if (files.length === 0) { console.log('No LHCI reports found.'); process.exit(0); }
            const seen = new Map();
            for (const file of files) {
              const lhr = JSON.parse(fs.readFileSync(path.join(dir, file), 'utf8'));
              const score = (id) => Math.round((lhr.categories[id]?.score ?? 0) * 100);
              seen.set(lhr.finalUrl, [score('performance'), score('accessibility'), score('best-practices'), score('seo')]);
            }
            const lines = ['### Lighthouse CI', '', '| URL | Perf | A11y | BP | SEO |', '|---|---:|---:|---:|---:|'];
            for (const [url, s] of seen) lines.push(\`| \${url} | \${s[0]} | \${s[1]} | \${s[2]} | \${s[3]} |\`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          "
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 90

  # RLS isolation via pgTAP against the configured test database.
  # Trusted CI requires SUPABASE_DB_URL; fork PRs skip this secret-dependent job.
  rls:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    needs: unit
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Require database URL
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL is required for trusted CI runs."
            exit 1
          fi
      - name: Run RLS isolation checks
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/rls_isolation.sql
