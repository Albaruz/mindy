name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app-moda/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app-moda
      - run: pnpm typecheck
        working-directory: app-moda
      - run: pnpm lint
        working-directory: app-moda
      - run: pnpm test:coverage
        working-directory: app-moda
